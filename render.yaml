# Render blueprint (FREE plan): New → Blueprint → pick this repo.
# Free web services have no disk, so pairs + push keys are kept in Upstash Redis (also free).
# Render will ask you to paste the two UPSTASH_* values when you create the blueprint.
services:
  - type: web
    name: beepback
    runtime: node
    plan: free
    region: singapore          # closest to India; change if your users are elsewhere
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false            # paste from the Upstash console
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false            # paste from the Upstash console
      - key: VAPID_SUBJECT
        sync: false            # e.g. mailto:you@yourmail.com
      - key: STREAK_TZ
        value: Asia/Kolkata
